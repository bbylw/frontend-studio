<!DOCTYPE html>
<!--
    GENERATIVE ART VIEWER. The template for a seeded, explorable piece.

    KEEP:
      the shell: header, sidebar, canvas area
      the token block below (replace the VALUES with this piece's palette; keep the token names)
      the seed section, the prev / next / random controls, and the seed read-out
      the export control
      self-contained: everything inline, no build step, no local dependencies

    WRITE YOURSELF:
      the algorithm (system() and drawGenerativeArt() below are placeholders)
      the parameters, and only the ones YOUR piece has
      the controls that drive them

    HOUSE RULES THAT APPLY TO THIS FILE (lint.mjs checks them if you point it here):
      flat fills only, no gradients on the ground, on controls or in text; no elevation on resting
      surfaces, so separate them with a tone step; no glass panels; no emoji; nothing meant to be
      read under 13px.

    The piece is the artwork. The chrome around it is furniture: quiet, neutral, out of the way.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative art. Replace with the work's title</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <style>
        /* ── tokens: keep the names, replace the values with this piece's palette ──
           Ground, one ink, one muted ink, one accent. The accent marks the primary control and
           nothing else. No second neutral between them. */
        :root {
            --bg: #fbfbfa;
            --surface: #f1f1ef;   /* one tone step from the ground: the sidebar, the canvas mat */
            --ink: #16161a;
            --muted: #63636b;     /* secondary text; still passes contrast on --bg */
            --accent: #16161a;    /* the primary control */
            --accent-ink: #fbfbfa;
            --line: #d9d9d5;      /* form fields only; never a divider between sections */

            --font-display: "Fraunces", Georgia, serif;
            --font-text: "Archivo", "Helvetica Neue", Arial, sans-serif;

            --step-small: 0.8125rem;   /* 13px floor */
            --step-body: 0.9375rem;
            --step-lead: 1.25rem;
            --step-head: 1.5rem;

            --gap: 20px;
            --radius: 0px;             /* one radius for the whole page: 0, or one large value */

            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --t-ui: 200ms;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-text);
            background: var(--bg);      /* flat: a gradient ground is a house-rule FAIL */
            min-height: 100dvh;
            color: var(--ink);
            font-size: var(--step-body);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent); color: var(--accent-ink); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        .container {
            display: flex;
            min-height: 100dvh;
            padding: var(--gap);
            gap: var(--gap);
            align-items: flex-start;
        }

        /* the panel: separated from the ground by a tone step, never by a line or a cast */
        .sidebar {
            width: 320px;
            flex: 0 0 320px;
            background: var(--surface);
            padding: 24px;
            border-radius: var(--radius);
            overflow-y: auto;
            max-height: calc(100dvh - var(--gap) * 2);
            position: sticky;
            top: var(--gap);
        }

        .sidebar h1 {
            font-family: var(--font-display);
            font-size: var(--step-head);
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.1;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .sidebar .subtitle {
            color: var(--muted);
            font-size: var(--step-small);
            line-height: 1.45;
            margin-bottom: 28px;
        }

        .control-section { margin-bottom: 28px; }

        /* Section headings are plain names, sentence case: "Seed", "Parameters", "Colour".
           No bullet glyph before a heading: that is an ornament, not information. */
        .control-section h3 {
            font-size: var(--step-small);
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 12px;
        }

        /* ── controls ── */
        .seed-row { display: flex; gap: 8px; }

        .seed-input,
        input[type="number"],
        input[type="range"] {
            font: inherit;
            color: inherit;
        }

        input.seed-input {
            width: 100%;
            min-height: 44px;                      /* touch target floor */
            padding: 8px 10px;
            background: var(--bg);
            border: 1px solid var(--line);         /* form fields may keep their lines */
            border-radius: var(--radius);
            font-variant-numeric: tabular-nums;
        }

        .seed-controls { display: flex; gap: 8px; margin-top: 8px; }
        .button-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            flex: 1 1 auto;
            padding: 0 14px;
            background: var(--accent);
            color: var(--accent-ink);
            border: 0;
            border-radius: var(--radius);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: transform 140ms var(--ease-out), background-color var(--t-ui) ease;
        }
        .button:active { transform: scale(0.98); }

        .button.secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);   /* fs-ignore: a solid-bordered control is allowed */
        }
        .button.tertiary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);   /* fs-ignore: a solid-bordered control is allowed */
            width: 100%;
            margin-top: 8px;
        }

        @media (hover: hover) and (pointer: fine) {
            .button:not(.secondary):not(.tertiary):hover { background: #000; }
            .button.secondary:hover, .button.tertiary:hover { background: var(--bg); }
        }

        .control-group, .color-group { margin-bottom: 16px; }

        .control-group > label,
        .color-group > label {
            display: block;
            font-size: var(--step-small);
            color: var(--muted);
            margin-bottom: 6px;
        }

        .slider-container { display: flex; align-items: center; gap: 10px; }

        input[type="range"] {
            flex: 1;
            min-height: 44px;
            accent-color: var(--accent);
            background: transparent;
        }

        .value-display {
            min-width: 56px;
            text-align: right;
            font-size: var(--step-small);
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }

        .color-picker-container { display: flex; align-items: center; gap: 10px; }

        input[type="color"] {
            width: 44px;
            height: 44px;
            padding: 2px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            cursor: pointer;
        }

        .color-value {
            font-size: var(--step-small);
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }

        /* the canvas: the artwork sits directly on the mat, with no frame and no cast */
        .canvas-area {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading { padding: 40px; color: var(--muted); }

        @media (max-width: 700px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; flex: 1 1 auto; position: static; max-height: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .button { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <!-- Replace both lines with the work's own title and one-line description. -->
            <h1>Title of the work</h1>
            <div class="subtitle">One line on what it is and how it is made.</div>

            <!-- Seed section: always keep. This is what makes the piece explorable. -->
            <div class="control-section">
                <h3>Seed</h3>
                <div class="seed-row">
                    <input type="number" id="seed-input" class="seed-input" min="1" value="12345"
                           inputmode="numeric" aria-label="Seed" onchange="updateSeed()">
                </div>
                <div class="seed-controls">
                    <button class="button secondary" type="button" onclick="previousSeed()">Previous</button>
                    <button class="button secondary" type="button" onclick="nextSeed()">Next</button>
                </div>
                <button class="button tertiary" type="button" onclick="randomSeedAndUpdate()">Random seed</button>
            </div>

            <!-- Parameters: keep only the ones this piece really has. -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label for="particleCount">Particle count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="1000" max="10000" step="500" value="5000"
                               oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">5000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label for="flowSpeed">Flow speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.1" max="2" step="0.1" value="0.5"
                               oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">0.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label for="noiseScale">Noise scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.001" value="0.005"
                               oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.005</span>
                    </div>
                </div>

                <div class="control-group">
                    <label for="trailLength">Trail length</label>
                    <div class="slider-container">
                        <input type="range" id="trailLength" min="2" max="20" step="1" value="8"
                               oninput="updateParam('trailLength', this.value)">
                        <span class="value-display" id="trailLength-value">8</span>
                    </div>
                </div>
            </div>

            <!-- Colour: two or three values taken from the piece's own palette, not an assistant palette. -->
            <div class="control-section">
                <h3>Colour</h3>

                <div class="color-group">
                    <label for="color1">Ground</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#f1f1ef" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#f1f1ef</span>
                    </div>
                </div>

                <div class="color-group">
                    <label for="color2">Ink</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#16161a" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#16161a</span>
                    </div>
                </div>

                <div class="color-group">
                    <label for="color3">Accent</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#2f4f6f" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#2f4f6f</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Export</h3>
                <div class="button-row">
                    <button class="button" type="button" onclick="exportPNG()">Save PNG</button>
                    <button class="button secondary" type="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Drawing…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // PARAMETERS — write the ones this piece needs. Every one of them must change
        // something a visitor can see; a control that does nothing is worse than absent.
        // ═══════════════════════════════════════════════════════════════════════════
        const DEFAULTS = {
            seed: 12345,
            particleCount: 5000,
            flowSpeed: 0.5,
            noiseScale: 0.005,
            trailLength: 8,
            palette: ['#f1f1ef', '#16161a', '#2f4f6f'],
        };
        let params = structuredClone(DEFAULTS);

        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        const SIZE = 1200;   // the piece is drawn at a fixed square size; CSS scales the display

        // ═══════════════════════════════════════════════════════════════════════════
        // YOUR ALGORITHM — replace the bodies of system() and drawGenerativeArt().
        // Seed every source of randomness so the same seed always gives the same piece:
        //   randomSeed(params.seed); noiseSeed(params.seed);
        // ═══════════════════════════════════════════════════════════════════════════
        const system = () => {
            // Build the system here: the field, the grid, the agents, the rules.
            // Called once per seed / parameter change, before the first frame.
        };

        const drawGenerativeArt = () => {
            // Draw one frame here. If the piece is static, draw it once and call noLoop().
            // If it evolves, leave the loop running and stop it under reduced motion (see below).
        };

        function setup() {
            const canvas = createCanvas(SIZE, SIZE);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            build();
        }

        function draw() {
            drawGenerativeArt();
            if (reduced.matches) noLoop();   // a moving piece becomes one still frame, not a hidden one
        }

        // Rebuild the whole piece from the current params. Every change goes through here.
        function build() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            system();
            if (reduced.matches) {
                drawGenerativeArt();
                noLoop();
            } else {
                loop();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════════
        function updateParam(name, value) {
            params[name] = Number(value);
            const readout = document.getElementById(name + '-value');
            if (readout) readout.textContent = value;
            build();
        }

        function updateColor(id, value) {
            const index = Number(id.replace('color', '')) - 1;
            params.palette[index] = value;
            document.getElementById(id + '-value').textContent = value;
            build();
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // SEED CONTROLS — keep these; they are what makes the piece explorable.
        // ═══════════════════════════════════════════════════════════════════════════
        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById('seed-input');
            const next = parseInt(input.value, 10);
            if (Number.isFinite(next) && next > 0) {
                params.seed = next;
                build();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            build();
        }

        function nextSeed() {
            params.seed += 1;
            updateSeedDisplay();
            build();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            build();
        }

        function resetParameters() {
            params = structuredClone(DEFAULTS);
            for (const [key, value] of Object.entries(DEFAULTS)) {
                const control = document.getElementById(key);
                if (control) control.value = value;
                const readout = document.getElementById(key + '-value');
                if (readout) readout.textContent = value;
            }
            DEFAULTS.palette.forEach((hex, i) => {
                const input = document.getElementById('color' + (i + 1));
                if (input) input.value = hex;
                const readout = document.getElementById('color' + (i + 1) + '-value');
                if (readout) readout.textContent = hex;
            });
            updateSeedDisplay();
            build();
        }

        // Export the current frame at full size, so the piece can be printed or posted.
        function exportPNG() {
            saveCanvas(`generative-${params.seed}`, 'png');
        }

        // A parameter change in a background tab should not keep the machine busy.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) noLoop();
            else if (!reduced.matches) loop();
        });

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
